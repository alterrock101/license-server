<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Maths - Agent Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2,
        h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #218838;
        }

        button.logout-btn {
            background: #dc3545;
            margin-top: 15px;
        }

        button.logout-btn:hover {
            background: #c82333;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }

        .key-display {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #2e7d32;
            margin-top: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #17a2b8;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🔑 AR Maths Agent Portal</h2>

        <!-- Agent Login Form -->
        <div id="login-form">
            <h3>Agent Login</h3>
            <div class="form-group">
                <label>Agent ID:</label>
                <input type="number" id="loginAgentId" placeholder="ဥပမာ - 1 သို့မဟုတ် 2">
            </div>
            <div class="form-group">
                <label>Secret PIN Code:</label>
                <input type="password" id="loginPin" placeholder="PIN Code ထည့်ပါ">
            </div>
            <button onclick="agentLogin()">Login ဝင်မည်</button>
        </div>

        <!-- Agent Dashboard -->
        <div id="agent-dashboard" style="display: none;">
            <h3>မင်္ဂလာပါ <span id="agentName" class="badge"></span></h3>

            <!-- 💡 6 Months နှင့် 1 Year Quota နှစ်မျိုးလုံးကို သီးသန့် ခွဲပြထားသည် -->
            <p style="text-align: center; font-size: 15px;">
                <b>6 Months Quota:</b> <b id="agentQuota6m" style="color: #007bff; font-size: 20px;">0</b> ခု |
                <b>1 Year Quota:</b> <b id="agentQuota1y" style="color: #28a745; font-size: 20px;">0</b> ခု
            </p>
            <hr>

            <div class="form-group">
                <label>Customer Device ID:</label>
                <input type="text" id="deviceId" placeholder="ဥပမာ - DEV-4C8093B2">
            </div>

            <div class="form-group">
                <label>Plan သက်တမ်း ရွေးချယ်ပါ:</label>
                <select id="agentPlanType">
                    <option value="6months">6 Months Plan (၆ လ သက်တမ်း)</option>
                    <option value="1year">1 Year Plan (၁ နှစ် သက်တမ်း)</option>
                </select>
            </div>

            <button onclick="generateKey()">Key အလိုအလျောက် ထုတ်မည်</button>
            <button class="logout-btn" onclick="agentLogout()">Logout ထွက်မည်</button>
        </div>

        <div id="result" class="result-box"></div>
    </div>

    <script>
        let currentAgent = null;

        async function agentLogin() {
            const agentId = document.getElementById('loginAgentId').value;
            const pin = document.getElementById('loginPin').value;

            if (!agentId || !pin) return alert("Agent ID နှင့် PIN Code ဖြည့်ပါ");

            try {
                const res = await fetch('/api/agent/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agentId, pin })
                });
                const data = await res.json();

                if (data.success) {
                    currentAgent = {
                        agentId,
                        pin,
                        name: data.agent.username,
                        quota_6m: data.agent.quota_6m || 0,
                        quota_1y: data.agent.quota_1y || 0
                    };
                    document.getElementById('agentName').innerText = data.agent.username;

                    // 💡 6 Months နှင့် 1 Year Balance များကို သီးသန့် ပြပေးမည်
                    if (document.getElementById('agentQuota6m')) {
                        document.getElementById('agentQuota6m').innerText = data.agent.quota_6m || 0;
                    }
                    if (document.getElementById('agentQuota1y')) {
                        document.getElementById('agentQuota1y').innerText = data.agent.quota_1y || 0;
                    }

                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('agent-dashboard').style.display = 'block';
                    document.getElementById('result').style.display = 'none';
                } else {
                    alert("❌ " + data.message);
                }
            } catch (err) {
                alert("❌ Server နှင့် ချိတ်ဆက်၍ မရပါ။");
            }
        }

        function agentLogout() {
            currentAgent = null;
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('agent-dashboard').style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }

        async function generateKey() {
            if (!currentAgent) return alert("ကျေးဇူးပြု၍ Login အရင်ဝင်ပါ");

            const deviceId = document.getElementById('deviceId').value;
            const planType = document.getElementById('agentPlanType').value; // 💡 Select Box မှ ရွေးထားသည့် Plan ယူမည်

            if (!deviceId) return alert("Device ID ရိုက်ထည့်ပါ");

            const res = await fetch('/api/agent/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    agentId: currentAgent.agentId,
                    pin: currentAgent.pin,
                    deviceId,
                    planType
                })
            });
            const data = await res.json();

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            if (data.success) {
                // 💡 ကျန်ရှိသည့် Quota အသစ်ကို Dashboard ပေါ်တွင် ပြန် Update လုပ်မည်
                if (planType === '6months') {
                    currentAgent.quota_6m = data.remainingQuota;
                    if (document.getElementById('agentQuota6m')) document.getElementById('agentQuota6m').innerText = data.remainingQuota;
                } else {
                    currentAgent.quota_1y = data.remainingQuota;
                    if (document.getElementById('agentQuota1y')) document.getElementById('agentQuota1y').innerText = data.remainingQuota;
                }

                resultDiv.innerHTML = `<h4 style="color:#2e7d32; margin:0 0 10px 0;">✅ ${data.message}</h4>
            <p><b>Plan သက်တမ်း:</b> ${planType === '6months' ? '6 Months' : '1 Year'}</p>
            <p><b>Device ID:</b> ${data.deviceId}</p>
            <p><b>Generated Key:</b></p>
            <div class="key-display">${data.licenseKey}</div>`;
            } else {
                resultDiv.innerHTML = `<h4 style="color:#c62828; margin:0;">❌ ${data.message}</h4>`;
            }
        }
    </script>
</body>

</html>
