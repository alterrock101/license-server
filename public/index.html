<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Maths - Agent Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2,
        h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #218838;
        }

        button.logout-btn {
            background: #6c757d;
            margin-top: 15px;
        }

        button.logout-btn:hover {
            background: #5a6268;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🔑 AR Maths Agent Portal</h2>

        <!-- Agent Login Form -->
        <div id="login-form">
            <h3>Agent Login</h3>
            <div class="form-group">
                <label>Agent ID:</label>
                <input type="number" id="loginAgentId" placeholder="ဥပမာ - 1 သို့မဟုတ် 2">
            </div>
            <div class="form-group">
                <label>Secret PIN Code:</label>
                <input type="password" id="loginPin" placeholder="PIN Code ထည့်ပါ">
            </div>
            <button type="button" onclick="agentLogin()">Login ဝင်မည်</button>
        </div>

        <!-- Agent Dashboard -->
        <div id="agent-dashboard" style="display:none;">
            <h3>Welcome, <span id="agentName"></span></h3>
            <p style="text-align:center;">6 Months Quota: <b id="agentQuota6m">0</b> | 1 Year Quota: <b
                    id="agentQuota1y">0</b></p>

            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

            <div class="form-group">
                <label>Customer Device ID:</label>
                <input type="text" id="deviceId" placeholder="Enter Device ID">
            </div>

            <div class="form-group">
                <label>Plan Type:</label>
                <select id="agentPlanType">
                    <option value="6months">6 Months Plan (၆ လ)</option>
                    <option value="1year">1 Year Plan (၁ နှစ်)</option>
                </select>
            </div>

            <button type="button" id="btnGenerate" onclick="generateKey(event)">
                Key အလိုအလျောက် ထုတ်မည်
            </button>

            <!-- Key ထွက်လာလျှင် ပြသပေးမည့် နေရာ (Duplicate ID များကို ရှင်းထုတ်ထားပါသည်) -->
            <div id="result" style="margin-top:20px; display:none;"></div>

            <button type="button" class="logout-btn" onclick="agentLogout()">
                Logout
            </button>
        </div>
    </div>

    <script>
        const BASE_URL = "https://armaths-license-server.onrender.com";
        const APP_SECRET_SALT = "AR_MATHS_SECURE_SALT_2026_!";

        let currentAgent = null;

        async function agentLogin() {
            const agentIdInput = document.getElementById('loginAgentId');
            const pinInput = document.getElementById('loginPin');

            const agentId = agentIdInput ? agentIdInput.value.trim() : '';
            const pin = pinInput ? pinInput.value.trim() : '';

            if (!agentId || !pin) return alert("❌ Agent ID နှင့် PIN Code ဖြည့်ပါ");

            try {
                const res = await fetch(`${BASE_URL}/api/agent/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agentId, pin })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    currentAgent = {
                        agentId: agentId,
                        pin: pin,
                        name: data.agent.username || agentId,
                        quota_6m: data.agent.quota_6m || 0,
                        quota_1y: data.agent.quota_1y || 0
                    };

                    updateQuotaUI(currentAgent.quota_6m, currentAgent.quota_1y);

                    if (document.getElementById('agentName')) {
                        document.getElementById('agentName').innerText = currentAgent.name;
                    }

                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('agent-dashboard').style.display = 'block';
                } else {
                    alert("❌ " + (data.message || "Login ဝင်၍ မရပါ"));
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert("❌ Server သို့ ချိတ်ဆက်၍ မရပါ။");
            }
        }

        function updateQuotaUI(q6m, q1y) {
            if (document.getElementById('agentQuota6m')) {
                document.getElementById('agentQuota6m').innerText = q6m || 0;
            }
            if (document.getElementById('agentQuota1y')) {
                document.getElementById('agentQuota1y').innerText = q1y || 0;
            }
            if (currentAgent) {
                currentAgent.quota_6m = q6m;
                currentAgent.quota_1y = q1y;
            }
        }

        function agentLogout() {
            currentAgent = null;
            document.getElementById('loginAgentId').value = '';
            document.getElementById('loginPin').value = '';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('agent-dashboard').style.display = 'none';

            const resultDiv = document.getElementById('result');
            if (resultDiv) {
                resultDiv.style.display = 'none';
                resultDiv.innerHTML = '';
            }
        }

        async function sha256(message) {
            try {
                if (window.crypto && window.crypto.subtle) {
                    const msgBuffer = new TextEncoder().encode(message);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } else {
                    console.error("Crypto API not available");
                    return "FALLBACK_HASH_ERROR";
                }
            } catch (err) {
                console.error("SHA256 Calc Error:", err);
                return "HASH_ERROR";
            }
        }

        async function generateKey(e) {
            if (e && e.preventDefault) e.preventDefault();

            const deviceIdInput = document.getElementById('deviceId');
            const deviceId = deviceIdInput ? deviceIdInput.value.trim().toUpperCase() : '';

            if (!deviceId) {
                alert("❌ Customer Device ID ကို ရိုက်ထည့်ပါ");
                return false;
            }

            if (!currentAgent || !currentAgent.agentId || !currentAgent.pin) {
                alert("❌ Agent Login Session ကုန်သွားပါပြီ။ ကျေးဇူးပြု၍ ပြန်လည် Login ဝင်ပါ။");
                agentLogout();
                return false;
            }

            const planType = document.getElementById('agentPlanType') ? document.getElementById('agentPlanType').value : '6months';
            const btn = document.getElementById('btnGenerate');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳ Key ထုတ်ပေးနေပါသည်...";
            }

            try {
                // ၁။ Expiry Date တွက်ချက်ခြင်း
                const d = new Date();
                if (planType === '1year' || planType === '1y') {
                    d.setFullYear(d.getFullYear() + 1);
                } else {
                    d.setMonth(d.getMonth() + 6);
                }
                const expiry = d.toISOString().split('T')[0];

                // ၂။ Local Signature / Key ထုတ်ယူခြင်း
                const payload = deviceId + "|" + expiry;
                const fullHash = await sha256(payload + APP_SECRET_SALT);
                const signature = fullHash.substring(0, 16).toUpperCase();
                const clientGeneratedKey = `${expiry}-${signature}`;

                // ၃။ Server သို့ API ပို့ခြင်း
                const res = await fetch(`${BASE_URL}/api/agent/generate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agentId: currentAgent.agentId,
                        pin: currentAgent.pin,
                        deviceId: deviceId,
                        planType: planType,
                        customKey: clientGeneratedKey
                    })
                });

                const data = await res.json();
                const resultDiv = document.getElementById('result');

                if (res.ok && data.success) {
                    const finalKey = data.licenseKey || data.key || clientGeneratedKey;
                    const planText = (planType === '1year' || planType === '1y') ? '1 Year Plan (၁ နှစ်)' : '6 Months Plan (၆ လ)';

                    if (deviceIdInput) deviceIdInput.value = '';

                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <div style="background:#e8f5e9; padding:15px; border-radius:8px; border:2px solid #2e7d32; text-align:left;">
                            <h4 style="color:#2e7d32; margin:0 0 10px 0;">✅ Key အောင်မြင်စွာ ထုတ်ပေးပြီးပါပြီ</h4>
                            <p style="margin:4px 0;"><b>Plan သက်တမ်း:</b> ${planText} (${expiry} အထိ)</p>
                            <p style="margin:4px 0;"><b>Customer Device ID:</b> <code style="background:#fff; padding:2px 6px; border-radius:4px; border:1px solid #ccc;">${deviceId}</code></p>
                            <p style="margin:8px 0 4px 0;"><b>License Key:</b></p>
                            <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                                <input type="text" id="generatedKeyText" readonly value="${finalKey}" style="font-size:15px; color:#d32f2f; font-weight:bold; background:#fff; padding:8px; border-radius:4px; border:1px solid #ccc; flex-grow:1;" />
                                <button type="button" onclick="copyKeyOnly('${finalKey}')" style="width:auto; margin:0; background:#28a745; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-size:13px; font-weight:bold;">
                                    📋 Copy Key
                                </button>
                            </div>
                        </div>
                    `;

                    // Quota လျှော့ချခြင်း
                    if (planType === '1year' || planType === '1y') {
                        const newQ = Math.max(0, (currentAgent.quota_1y || 1) - 1);
                        updateQuotaUI(currentAgent.quota_6m, newQ);
                    } else {
                        const newQ = Math.max(0, (currentAgent.quota_6m || 1) - 1);
                        updateQuotaUI(newQ, currentAgent.quota_1y);
                    }

                } else {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `<div style="background:#ffebee; padding:12px; border-radius:6px; border:1px solid #ef5350;"><h4 style="color:#c62828; margin:0;">❌ ${data.message || 'Key ထုတ်မရပါ'}</h4></div>`;
                    alert("❌ Server Error: " + (data.message || "Key ထုတ်မရပါ"));
                }
            } catch (err) {
                console.error("❌ Catch Error in generateKey:", err);
                alert("❌ JavaScript Error: " + err.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Key အလိုအလျောက် ထုတ်မည်";
                }
            }

            return false;
        }

        function copyKeyOnly(keyText) {
            if (!keyText) {
                const input = document.getElementById("generatedKeyText");
                if (input) keyText = input.value;
            }
            if (keyText) {
                navigator.clipboard.writeText(keyText).then(() => {
                    alert("📋 License Key ကို Copy ကူးပြီးပါပြီ -\n" + keyText);
                }).catch(err => {
                    const input = document.getElementById("generatedKeyText");
                    if (input) {
                        input.select();
                        document.execCommand("copy");
                        alert("📋 License Key ကို Copy ကူးပြီးပါပြီ");
                    }
                });
            }
        }
    </script>
</body>

</html>
