<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Maths - Agent Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2,
        h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #218838;
        }

        button.logout-btn {
            background: #dc3545;
            margin-top: 15px;
        }

        button.logout-btn:hover {
            background: #c82333;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }

        .key-display {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #2e7d32;
            margin-top: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #17a2b8;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🔑 AR Maths Agent Portal</h2>

        <!-- Agent Login Form -->
        <div id="login-form">
            <h3>Agent Login</h3>
            <div class="form-group">
                <label>Agent ID:</label>
                <input type="number" id="loginAgentId" placeholder="ဥပမာ - 1 သို့မဟုတ် 2">
            </div>
            <div class="form-group">
                <label>Secret PIN Code:</label>
                <input type="password" id="loginPin" placeholder="PIN Code ထည့်ပါ">
            </div>
            <button onclick="agentLogin()">Login ဝင်မည်</button>
        </div>

        <!-- Agent Dashboard -->
        <div id="agent-dashboard" style="display:none;">
            <h3>Welcome, <span id="agentName"></span></h3>
            <p>6 Months Quota: <b id="agentQuota6m">0</b> | 1 Year Quota: <b id="agentQuota1y">0</b></p>

            <hr>

            <label>Customer Device ID:</label><br>
            <input type="text" id="deviceId" placeholder="Enter Device ID"
                style="width:100%; padding:8px; margin:8px 0;"><br>

            <label>Plan Type:</label><br>
            <select id="agentPlanType" style="width:100%; padding:8px; margin:8px 0;">
                <option value="6months">6 Months Plan (၆ လ)</option>
                <option value="1year">1 Year Plan (၁ နှစ်)</option>
            </select><br><br>

            <!-- Button တွင် type="button" ပါရန် လိုအပ်သည် (Form submit မဖြစ်စေရန်) -->
            <button type="button" onclick="generateKey(event)"
                style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">
                Key အလိုအလျောက် ထုတ်မည်
            </button>

            <!-- 💡 Result Box ကို ရှင်းရှင်းလင်းလင်း သီးသန့် ပြသပေးမည့်နေရာ -->
            <div id="result" style="margin-top:20px;"></div>

            <button type="button" onclick="agentLogout()"
                style="padding:10px 15px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer; margin-left:10px;">
                Logout
            </button>

            <!-- 💡 Key ထွက်လာလျှင် ပြသပေးမည့် နေရာ -->
            <div id="result" style="margin-top:20px; display:none;"></div>
        </div>

        <script>
            window.BASE_URL = "https://armaths-license-server.onrender.com";
            const BASE_URL = "https://armaths-license-server.onrender.com";

            let currentAgent = null;

            async function agentLogin() {
                const agentIdInput = document.getElementById('loginAgentId');
                const pinInput = document.getElementById('loginPin');

                const agentId = agentIdInput ? agentIdInput.value.trim() : '';
                const pin = pinInput ? pinInput.value.trim() : '';

                if (!agentId || !pin) return alert("❌ Agent ID နှင့် PIN Code ဖြည့်ပါ");

                window.currentAgentId = agentId;
                window.currentPin = pin;

                const host = (typeof BASE_URL !== 'undefined' ? BASE_URL : (window.BASE_URL || "https://armaths-license-server.onrender.com"));

                try {
                    const res = await fetch(`${host}/api/agent/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ agentId, pin })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        currentAgent = {
                            agentId,
                            pin,
                            name: data.agent.username,
                            quota_6m: data.agent.quota_6m || 0,
                            quota_1y: data.agent.quota_1y || 0
                        };

                        updateQuotaUI(data.agent.quota_6m, data.agent.quota_1y);

                        if (document.getElementById('agentName')) {
                            document.getElementById('agentName').innerText = data.agent.username;
                        }

                        document.getElementById('login-form').style.display = 'none';
                        document.getElementById('agent-dashboard').style.display = 'block';
                    } else {
                        alert("❌ " + (data.message || "Login ဝင်၍ မရပါ"));
                    }
                } catch (err) {
                    console.error("Login Error:", err);
                    alert("❌ Server သို့ ချိတ်ဆက်၍ မရပါ။");
                }
            }

            function updateQuotaUI(q6m, q1y) {
                if (document.getElementById('agentQuota6m')) {
                    document.getElementById('agentQuota6m').innerText = q6m || 0;
                }
                if (document.getElementById('agentQuota1y')) {
                    document.getElementById('agentQuota1y').innerText = q1y || 0;
                }
                if (currentAgent) {
                    currentAgent.quota_6m = q6m;
                    currentAgent.quota_1y = q1y;
                }
            }

            function agentLogout() {
                currentAgent = null;
                window.currentAgentId = null;
                window.currentPin = null;

                document.getElementById('login-form').style.display = 'block';
                document.getElementById('agent-dashboard').style.display = 'none';
                if (document.getElementById('result')) document.getElementById('result').style.display = 'none';
            }

            // 💡 App က အသုံးပြုသော Secret Salt
            const APP_SECRET_SALT = "AR_MATHS_SECURE_SALT_2026_!";

            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function generateKey(e) {
                if (e && e.preventDefault) e.preventDefault();

                const deviceIdInput = document.getElementById('deviceId');
                const deviceId = deviceIdInput ? deviceIdInput.value.trim().toUpperCase() : '';

                if (!deviceId) {
                    alert("❌ Customer Device ID ကို ရိုက်ထည့်ပါ");
                    return false;
                }

                const agentIdInput = document.getElementById('loginAgentId');
                const pinInput = document.getElementById('loginPin');

                const agentId = (agentIdInput ? agentIdInput.value.trim() : '') || window.currentAgentId;
                const pin = (pinInput ? pinInput.value.trim() : '') || window.currentPin;
                const planType = document.getElementById('agentPlanType') ? document.getElementById('agentPlanType').value : '6months';

                if (!agentId || !pin) {
                    alert("❌ Agent ID သို့မဟုတ် PIN မရှိပါ။ ကျေးဇူးပြု၍ ပြန်လည် Login ဝင်ပါ။");
                    return false;
                }

                const btn = e ? e.target : document.querySelector("#agent-dashboard button");
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = "⏳ Key ထုတ်ပေးနေပါသည်...";
                }

                const host = (typeof BASE_URL !== 'undefined' ? BASE_URL : (window.BASE_URL || "https://armaths-license-server.onrender.com"));

                try {
                    // 💡 ၁။ Plan အလိုက် Expiry Date တွက်ချက်ခြင်း
                    const d = new Date();
                    if (planType === '1year' || planType === '1y') {
                        d.setFullYear(d.getFullYear() + 1);
                    } else {
                        d.setMonth(d.getMonth() + 6);
                    }
                    const expiry = d.toISOString().split('T')[0]; // "YYYY-MM-DD"

                    // 💡 ၂။ App ဘက်က စစ်ဆေးသည့် SHA256 Signature တွက်ထုတ်ခြင်း
                    const payload = deviceId + "|" + expiry;
                    const fullHash = await sha256(payload + APP_SECRET_SALT);
                    const signature = fullHash.substring(0, 16).toUpperCase();

                    // Offline App Activation Key
                    const clientGeneratedKey = `${expiry}-${signature}`;

                    // 💡 ၃။ Server သို့ Quota နှုတ်ရန်နှင့် Record မှတ်ရန် ပို့ခြင်း
                    const res = await fetch(`${host}/api/agent/generate-key`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            agentId,
                            pin,
                            deviceId,
                            planType,
                            customKey: clientGeneratedKey
                        })
                    });

                    const data = await res.json();
                    const resultDiv = document.getElementById('result');

                    if (res.ok && data.success) {
                        // Server က ပြန်လာသော Key သို့မဟုတ် Local က ထုတ်လိုက်သော Key ကို သုံးမည်
                        const finalKey = data.licenseKey || data.key || clientGeneratedKey;
                        const planText = (planType === '1year' || planType === '1y') ? '1 Year Plan (၁ နှစ်)' : '6 Months Plan (၆ လ)';

                        if (deviceIdInput) deviceIdInput.value = '';

                        if (resultDiv) {
                            resultDiv.style.display = 'block';
                            resultDiv.innerHTML = `
                        <div style="background:#e8f5e9; padding:15px; border-radius:8px; border:2px solid #2e7d32; text-align:left; margin-top:15px;">
                            <h4 style="color:#2e7d32; margin:0 0 10px 0;">✅ Key အောင်မြင်စွာ ထုတ်ပေးပြီးပါပြီ</h4>
                            <p style="margin:4px 0;"><b>Plan သက်တမ်း:</b> ${planText} (${expiry} အထိ)</p>
                            <p style="margin:4px 0;"><b>Customer Device ID:</b> <code style="background:#fff; padding:2px 6px; border-radius:4px; border:1px solid #ccc;">${deviceId}</code></p>
                            <p style="margin:8px 0 4px 0;"><b>License Key:</b></p>
                            <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                                <input type="text" id="generatedKeyText" readonly value="${finalKey}" style="font-size:15px; color:#d32f2f; font-weight:bold; background:#fff; padding:8px 12px; border-radius:4px; border:1px solid #ccc; flex-grow:1;" />
                                <button type="button" onclick="copyKeyOnly('${finalKey}')" style="background:#28a745; color:white; border:none; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:13px; flex-shrink:0; font-weight:bold;">
                                    📋 Copy Key
                                </button>
                            </div>
                        </div>
                    `;
                        }

                        if (currentAgent) {
                            if (planType === '1year' || planType === '1y') {
                                const newQ = Math.max(0, (currentAgent.quota_1y || 1) - 1);
                                updateQuotaUI(currentAgent.quota_6m, newQ);
                            } else {
                                const newQ = Math.max(0, (currentAgent.quota_6m || 1) - 1);
                                updateQuotaUI(newQ, currentAgent.quota_1y);
                            }
                        }

                    } else {
                        if (resultDiv) {
                            resultDiv.style.display = 'block';
                            resultDiv.innerHTML = `<h4 style="color:#c62828; margin-top:10px;">❌ ${data.message || 'Key ထုတ်မရပါ'}</h4>`;
                        }
                    }
                } catch (err) {
                    alert("❌ Error: " + err.message);
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "Key အလိုအလျောက် ထုတ်မည်";
                    }
                }

                return false;
            }

            // 💡 အောက်ပါ Copy Function လေး မရှိခဲ့လို့ Error တက်ပြီး Key Box မပေါ်တာဖြစ်ပါတယ်
            function copyKeyOnly(keyText) {
                if (!keyText) {
                    const input = document.getElementById("generatedKeyText");
                    if (input) keyText = input.value;
                }
                if (keyText) {
                    navigator.clipboard.writeText(keyText).then(() => {
                        alert("📋 License Key ကို Copy ကူးပြီးပါပြီ - " + keyText);
                    }).catch(err => {
                        // Fallback for older browsers
                        const input = document.getElementById("generatedKeyText");
                        if (input) {
                            input.select();
                            document.execCommand("copy");
                            alert("📋 License Key ကို Copy ကူးပြီးပါပြီ");
                        }
                    });
                }
            }
        </script>
</body>

</html>
