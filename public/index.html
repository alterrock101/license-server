<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Maths - Agent Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2,
        h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #218838;
        }

        button.logout-btn {
            background: #dc3545;
            margin-top: 15px;
        }

        button.logout-btn:hover {
            background: #c82333;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }

        .key-display {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #2e7d32;
            margin-top: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #17a2b8;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🔑 AR Maths Agent Portal</h2>

        <!-- Agent Login Form -->
        <div id="login-form">
            <h3>Agent Login</h3>
            <div class="form-group">
                <label>Agent ID:</label>
                <input type="number" id="loginAgentId" placeholder="ဥပမာ - 1 သို့မဟုတ် 2">
            </div>
            <div class="form-group">
                <label>Secret PIN Code:</label>
                <input type="password" id="loginPin" placeholder="PIN Code ထည့်ပါ">
            </div>
            <button onclick="agentLogin()">Login ဝင်မည်</button>
        </div>

        <!-- Agent Dashboard -->
        <div id="agent-dashboard" style="display: none;">
            <h3>မင်္ဂလာပါ <span id="agentName" class="badge"></span></h3>

            <!-- 💡 6 Months နှင့် 1 Year Quota နှစ်မျိုးလုံးကို သီးသန့် ခွဲပြထားသည် -->
            <p style="text-align: center; font-size: 15px;">
                <b>6 Months Quota:</b> <b id="agentQuota6m" style="color: #007bff; font-size: 20px;">0</b> ခု |
                <b>1 Year Quota:</b> <b id="agentQuota1y" style="color: #28a745; font-size: 20px;">0</b> ခု
            </p>
            <hr>

            <div class="form-group">
                <label>Customer Device ID:</label>
                <input type="text" id="deviceId" placeholder="ဥပမာ - DEV-4C8093B2">
            </div>

            <div class="form-group">
                <label>Plan သက်တမ်း ရွေးချယ်ပါ:</label>
                <select id="agentPlanType">
                    <option value="6months">6 Months Plan (၆ လ သက်တမ်း)</option>
                    <option value="1year">1 Year Plan (၁ နှစ် သက်တမ်း)</option>
                </select>
            </div>

            <button onclick="generateKey()">Key အလိုအလျောက် ထုတ်မည်</button>
            <button class="logout-btn" onclick="agentLogout()">Logout ထွက်မည်</button>
        </div>

        <div id="result" class="result-box"></div>
    </div>

    <script>
        // 💡 Render Server URL
        window.BASE_URL = "https://armaths-license-server.onrender.com";
        const BASE_URL = "https://armaths-license-server.onrender.com";

        let currentAgent = null;

        async function agentLogin() {
            const agentIdInput = document.getElementById('loginAgentId');
            const pinInput = document.getElementById('loginPin');

            const agentId = agentIdInput ? agentIdInput.value.trim() : '';
            const pin = pinInput ? pinInput.value.trim() : '';

            if (!agentId || !pin) return alert("❌ Agent ID နှင့် PIN Code ဖြည့်ပါ");

            window.currentAgentId = agentId;
            window.currentPin = pin;
            localStorage.setItem('agentId', agentId);
            localStorage.setItem('pin', pin);

            const host = (typeof BASE_URL !== 'undefined' ? BASE_URL : (window.BASE_URL || "https://armaths-license-server.onrender.com"));

            try {
                // 💡 BASE_URL ကို မှန်ကန်စွာ ထည့်သွင်းထားပါသည်
                const res = await fetch(`${host}/api/agent/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agentId, pin })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    currentAgent = {
                        agentId,
                        pin,
                        name: data.agent.username,
                        quota_6m: data.agent.quota_6m || 0,
                        quota_1y: data.agent.quota_1y || 0
                    };

                    if (document.getElementById('agentName')) {
                        document.getElementById('agentName').innerText = data.agent.username;
                    }

                    if (document.getElementById('agentQuota6m')) {
                        document.getElementById('agentQuota6m').innerText = data.agent.quota_6m || 0;
                    }
                    if (document.getElementById('agentQuota1y')) {
                        document.getElementById('agentQuota1y').innerText = data.agent.quota_1y || 0;
                    }

                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('agent-dashboard').style.display = 'block';
                    if (document.getElementById('result')) document.getElementById('result').style.display = 'none';
                } else {
                    alert("❌ " + (data.message || "Login ဝင်၍ မရပါ"));
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert("❌ Server သို့ ချိတ်ဆက်၍ မရပါ။ (Internet connection သို့မဟုတ် Server URL ကို စစ်ဆေးပါ)");
            }
        }

        function agentLogout() {
            currentAgent = null;
            window.currentAgentId = null;
            window.currentPin = null;
            localStorage.removeItem('agentId');
            localStorage.removeItem('pin');

            document.getElementById('login-form').style.display = 'block';
            document.getElementById('agent-dashboard').style.display = 'none';
            if (document.getElementById('result')) document.getElementById('result').style.display = 'none';
        }

        async function generateKey() {
            const btn = document.querySelector("#agent-dashboard button[onclick='generateKey()']");
            const deviceIdInput = document.getElementById('deviceId');

            const agentIdInput = document.getElementById('loginAgentId');
            const pinInput = document.getElementById('loginPin');

            const agentId = (agentIdInput ? agentIdInput.value.trim() : '') || window.currentAgentId || localStorage.getItem('agentId');
            const pin = (pinInput ? pinInput.value.trim() : '') || window.currentPin || localStorage.getItem('pin');

            const deviceId = deviceIdInput ? deviceIdInput.value.trim() : '';
            const planType = document.getElementById('agentPlanType') ? document.getElementById('agentPlanType').value : '6months';

            if (!agentId || !pin) {
                alert("❌ Agent ID သို့မဟုတ် PIN မရှိပါ။ ကျေးဇူးပြု၍ ပြန်လည် Login ဝင်ပါ။");
                return;
            }

            if (!deviceId) {
                alert("❌ Customer Device ID ကို ရိုက်ထည့်ပါ");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳ Key ထုတ်ပေးနေပါသည်...";
                btn.style.opacity = "0.6";
                btn.style.cursor = "not-allowed";
            }

            const host = (typeof BASE_URL !== 'undefined' ? BASE_URL : (window.BASE_URL || "https://armaths-license-server.onrender.com"));

            try {
                const res = await fetch(`${host}/api/agent/generate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agentId, pin, deviceId, planType })
                });

                const textResponse = await res.text();
                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error("Server Response မှားယွင်းနေပါသည်။ (" + textResponse.substring(0, 100) + ")");
                }

                const resultDiv = document.getElementById('result');
                if (resultDiv) resultDiv.style.display = 'block';

                if (res.ok && data.success) {
                    const planText = (planType === '1year' || planType === '1y') ? '1 Year Plan (၁ နှစ်)' : '6 Months Plan (၆ လ)';

                    if (resultDiv) {
                        resultDiv.innerHTML = `
                        <div style="background:#e8f5e9; padding:15px; border-radius:8px; border:1px solid #4caf50; text-align:left;">
                            <h4 style="color:#2e7d32; margin:0 0 10px 0;">✅ Key အောင်မြင်စွာ ထုတ်ပေးပြီးပါပြီ</h4>
                            <p style="margin:4px 0;"><b>Plan သက်တမ်း:</b> ${planText}</p>
                            <p style="margin:4px 0;"><b>Customer Device ID:</b> <code>${data.deviceId}</code></p>
                            <p style="margin:6px 0;"><b>License Key:</b></p>
                            <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                                <code style="font-size:16px; color:#d32f2f; font-weight:bold; background:#fff; padding:6px 10px; border-radius:4px; border:1px solid #ccc;">${data.licenseKey}</code>
                                <button onclick="copyToClipboard('${data.licenseKey}')" style="background:#28a745; color:white; border:none; padding:7px 12px; border-radius:5px; cursor:pointer; font-size:13px;">
                                    📋 Copy Key
                                </button>
                            </div>
                        </div>
                    `;
                    }

                    if (deviceIdInput) deviceIdInput.value = '';

                    // Balance ပြန်လည် update လုပ်ရန်
                    if (typeof agentLogin === 'function') agentLogin();
                } else {
                    if (resultDiv) {
                        resultDiv.innerHTML = `<h4 style="color:#c62828; margin:0;">❌ ${data.message || 'Key ထုတ်မရပါ'}</h4>`;
                    } else {
                        alert(`❌ ${data.message || 'Key ထုတ်မရပါ'}`);
                    }
                }
            } catch (err) {
                alert("❌ Server သို့ Request ပို့ရာတွင် Error တက်သွားပါသည်။\n" + err.message);
                console.error("Generate Key Error:", err);
            } finally {
                setTimeout(() => {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "Key အလိုအလျောက် ထုတ်မည်";
                        btn.style.opacity = "1";
                        btn.style.cursor = "pointer";
                    }
                }, 1000);
            }
        }

        function copyToClipboard(key) {
            navigator.clipboard.writeText(key).then(() => {
                alert("📋 Activation Key ကို Copy ကူးပြီးပါပြီ။");
            }).catch(err => {
                console.error("Copy Error:", err);
            });
        }
    </script>
</body>

</html>
